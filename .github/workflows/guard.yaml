name: CD Pipeline

on: 
  pull_request:
    branches:
      - stage

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps: 
      - name: Check out code
        run: |
          if [ "${{ github.head_ref }}" != "devel" ]; then
            echo "You should use devel"
            exit 1
          fi